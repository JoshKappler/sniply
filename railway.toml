[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node scripts/init-data.mjs && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public 2>/dev/null; HOSTNAME=0.0.0.0 PORT=${PORT:-3000} node .next/standalone/server.js"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
